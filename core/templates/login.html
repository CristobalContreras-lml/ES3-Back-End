{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block contenido %}
<h2>Entrar al sistema</h2>
<p class="sub">Monitoreo de vencimiento de insumos · bodega cocina central</p>

<form method="post" class="tarjeta-form" style="max-width:380px">
  {% csrf_token %}
  <div class="campo-fila">
    <label for="username">Usuario</label>
    <input type="text" name="username" id="username" class="campo" required autofocus>
  </div>
  <div class="campo-fila">
    <label for="password">Contraseña</label>
    <input type="password" name="password" id="password" class="campo" required>
  </div>
  <button type="submit" class="btn">Entrar</button>
</form>
{% endblock %}
